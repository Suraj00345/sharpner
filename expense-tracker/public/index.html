<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.8/axios.min.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="header-div">
        <h2>Expense Tracker</h2>
        <button id="premiumBtn">Premium Membership - ₹99</button>
        <div id="premiumMessage"></div>
      </div>

      <form id="expenseForm" onsubmit="handleFormSubmit(event)">
        <div class="form-group">
          <label for="amount">Expense Amount</label>
          <input
            type="number"
            id="amount"
            step="0.01"
            required
            placeholder="Enter amount"
          />
        </div>

        <div class="form-group">
          <label for="description">Choose Description</label>
          <input
            type="text"
            id="description"
            required
            placeholder="Enter description"
          />
        </div>

        <div class="form-group">
          <label for="category">Choose Category</label>
          <select id="category" required>
            <option value="Fuel">Fuel</option>
            <option value="Food">Food</option>
            <option value="Drink">Drink</option>
            <option value="Electricity">Electricity</option>
            <option value="Movie">Movie</option>
            <option value="Shopping">Shopping</option>
          </select>
        </div>

        <button type="submit" class="btn-submit">Add Expense</button>
        <div style="display: flex; justify-content: space-between">
          <button id="leaderboardBtn">Show Leaderboard</button>
          <button id="downloadBtn">Download Report</button>
        </div>
      </form>

      <h3>Expenses List</h3>
      <ul id="expenseList"></ul>
      <!-- Pagination Controls -->
      <div
        class="pagination-container"
        style="display: flex; gap: 10px; align-items: center; margin-top: 15px"
      >
        <button id="prevBtn" disabled>Previous</button>
        <span id="pageInfo">Page 1</span>
        <button id="nextBtn" disabled>Next</button>
      </div>
    </div>
    <!-- modal -->
    <div id="leaderboardModal" class="leaderboard-modal" style="display: none">
      <div class="leaderboard-content">
        <button id="closeLeaderboard" class="close-btn">✕</button>

        <h2>🏆 Expense Leaderboard</h2>

        <p>Users who spent more appear at the top.</p>

        <div id="leaderboardList">Loading...</div>
      </div>
    </div>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <script src="main.js"></script>
  </body>
</html>
