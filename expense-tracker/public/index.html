<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.8/axios.min.js"></script>
</head>
<body>
  <div class="container">
    <h2>Expense Tracker</h2>

    <form id="expenseForm" onsubmit="handleFormSubmit(event)">
      <div class="form-group">
        <label for="amount">Expense Amount</label>
        <input type="number" id="amount" step="0.01" required placeholder="Enter amount">
      </div>

      <div class="form-group">
        <label for="description">Choose Description</label>
        <input type="text" id="description" required placeholder="Enter description">
      </div>

      <div class="form-group">
        <label for="category">Choose Category</label>
        <select id="category" required>
          <option value="Fuel">Fuel</option>
          <option value="Food">Food</option>
          <option value="Drink">Drink</option>
          <option value="Electricity">Electricity</option>
          <option value="Movie">Movie</option>
          <option value="Shopping">Shopping</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">Add Expense</button>
    </form>

    <h3>Expenses List</h3>
    <ul id="expenseList"></ul>
  </div>

  <script src="main.js"></script>
</body>
</html>
