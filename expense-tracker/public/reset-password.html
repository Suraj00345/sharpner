<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set New Password</title>
    <style>
      :root {
        --primary-color: #4f46e5;
        --primary-hover: #4338ca;
        --bg-color: #f3f4f6;
        --text-color: #1f2937;
        --border-color: #d1d5db;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .container {
        background-color: white;
        padding: 2.5rem;
        border-radius: 10px;
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
        width: 100%;
        max-width: 400px;
        box-sizing: border-box;
      }

      h2 {
        margin-top: 0;
        margin-bottom: 1.5rem;
        font-size: 1.5rem;
        text-align: center;
        color: #111827;
      }

      .form-group {
        margin-bottom: 1.25rem;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        font-size: 0.9rem;
      }

      input[type="password"] {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 1rem;
        transition: border-color 0.2s;
      }

      input[type="password"]:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
      }

      button {
        width: 100%;
        background-color: var(--primary-color);
        color: white;
        padding: 0.75rem;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      button:hover {
        background-color: var(--primary-hover);
      }

      button:disabled {
        background-color: #9ca3af;
        cursor: not-allowed;
      }

      #resetMessage {
        margin-top: 1rem;
        text-align: center;
        font-size: 0.9rem;
        font-weight: 500;
        min-height: 20px;
      }

      .error-container {
        text-align: center;
      }

      .error-container a {
        display: inline-block;
        margin-top: 1rem;
        color: var(--primary-color);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="container" id="mainContainer">
      <h2>Set New Password</h2>

      <form id="resetForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input
            type="password"
            id="newPassword"
            required
            placeholder="Enter new password"
            minlength="6"
          />
        </div>
        <button type="submit" id="resetBtn">Update Password</button>
      </form>

      <p id="resetMessage"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
      const API_URL = "http://localhost:3000/api/";
      const form = document.getElementById("resetForm");
      const messageEl = document.getElementById("resetMessage");
      const resetBtn = document.getElementById("resetBtn");
      const mainContainer = document.getElementById("mainContainer");

      // Extract the token from the URL
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");

      // If there is no token in the URL, replace the container content with an error
      if (!token) {
        mainContainer.innerHTML = `
        <div class="error-container">
          <h2 style="color: #dc2626;">Invalid Link</h2>
          <p>No reset token was provided.</p>
          <a href="forgot-password.html">Request a new reset link</a>
        </div>
      `;
      }

      form?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const newPassword = document.getElementById("newPassword").value;

        resetBtn.disabled = true;
        resetBtn.textContent = "Updating...";
        messageEl.textContent = "";

        try {
          const response = await axios.post(`${API_URL}auth/reset`, {
            token: token,
            newPassword: newPassword,
          });

          messageEl.textContent = "Password updated! Redirecting to login...";
          messageEl.style.color = "#059669"; // Success green

          setTimeout(() => {
            window.location.href = "login.html";
          }, 2000);
        } catch (error) {
          messageEl.textContent =
            error.response?.data?.message ||
            "Failed to reset password. Link may be expired.";
          messageEl.style.color = "#dc2626"; // Error red
          resetBtn.disabled = false;
          resetBtn.textContent = "Update Password";
        }
      });
    </script>
  </body>
</html>
