<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
    <style>
      :root {
        --primary-color: #4f46e5;
        --primary-hover: #4338ca;
        --bg-color: #f3f4f6;
        --text-color: #1f2937;
        --border-color: #d1d5db;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .container {
        background-color: white;
        padding: 2.5rem;
        border-radius: 10px;
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
        width: 100%;
        max-width: 400px;
        box-sizing: border-box;
      }

      h2 {
        margin-top: 0;
        margin-bottom: 1.5rem;
        font-size: 1.5rem;
        text-align: center;
        color: #111827;
      }

      .form-group {
        margin-bottom: 1.25rem;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        font-size: 0.9rem;
      }

      input[type="email"] {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 1rem;
        transition: border-color 0.2s;
      }

      input[type="email"]:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
      }

      button {
        width: 100%;
        background-color: var(--primary-color);
        color: white;
        padding: 0.75rem;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      button:hover {
        background-color: var(--primary-hover);
      }

      button:disabled {
        background-color: #9ca3af;
        cursor: not-allowed;
      }

      #message {
        margin-top: 1rem;
        text-align: center;
        font-size: 0.9rem;
        font-weight: 500;
        min-height: 20px;
      }

      .back-link {
        display: block;
        text-align: center;
        margin-top: 1.5rem;
        color: var(--primary-color);
        text-decoration: none;
        font-size: 0.9rem;
      }

      .back-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Reset Your Password</h2>

      <form id="forgotForm">
        <div class="form-group">
          <label for="email">Enter your email address</label>
          <input
            type="email"
            id="email"
            required
            placeholder="user@example.com"
          />
        </div>
        <button type="submit" id="submitBtn">Send Reset Link</button>
      </form>

      <p id="message"></p>

      <a href="login.html" class="back-link">Back to Login</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
      const API_URL = "http://localhost:3000/api/";
      const form = document.getElementById("forgotForm");
      const messageEl = document.getElementById("message");
      const submitBtn = document.getElementById("submitBtn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value;

        submitBtn.disabled = true;
        submitBtn.textContent = "Sending...";
        messageEl.textContent = "";

        try {
          const response = await axios.post(`${API_URL}auth/forgot`, {
            email,
          });
          messageEl.textContent = response.data.message;
          messageEl.style.color = "#059669"; // Success green
        } catch (error) {
          messageEl.textContent =
            error.response?.data?.message || "Something went wrong.";
          messageEl.style.color = "#dc2626"; // Error red
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Send Reset Link";
        }
      });
    </script>
  </body>
</html>
